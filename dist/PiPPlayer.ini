; PiP Player settings. Edit while the game is closed; the control panel saves layout and volume changes here.

[Overlay]
; TopLeft, TopRight, BottomLeft or BottomRight
Corner=TopRight
; Video width in pixels at the game's resolution; height follows the video's aspect ratio
Width=600
; Distance from the screen edges in pixels
MarginX=24
MarginY=24
; 0.05 (almost transparent) to 1.0 (opaque)
Opacity=0.92
; Video brightness, -100 (darker) to 100 (brighter); 0 = unchanged
Brightness=0
; Rounded corner radius in pixels (0 = square)
CornerRadius=6

[Playback]
; 0 to 100
Volume=75
; Repeat the video when it ends
Loop=false
; Initial text of the control panel's URL box (an http(s) URL, a YouTube link, or a local file path)
Url=
; Highest YouTube resolution to request (e.g. 360, 480, 720, 1080); 0 = best available.
; Lower is lighter on the CPU, which decodes the video under CrossOver.
YouTubeMaxHeight=1080
; How YouTube lookups use QuickJS (qjs.exe), which solves YouTube's JavaScript challenge for yt-dlp:
;   Always   - every lookup (yt-dlp's supported setup; about 1-2 s slower under CrossOver)
;   Fallback - skip it, and retry a lookup that fails with it (faster)
;   Off      - never (fastest; some videos may fail or miss qualities)
YouTubeSolver=Always
; Pause the video while you are in a conversation
PauseForDialogue=true
; Resume it this many seconds after the conversation ends (0 = don't resume then)
ResumeAfterDialogue=8
; Or resume it once no one has spoken for this many seconds, even if the conversation is still open (0 = don't)
ResumeAfterSilence=15
; Once a save loads, play the last video from where it left off, if it was still playing or paused when you quit. Every video also resumes from its last position
; (the last 100 are remembered in My Games/Skyrim Special Edition/SKSE/PiPPlayer_History.txt).
ResumeOnStart=true

[Hotkeys]
; Key names: a single character ([ ] \ ; ' , . / - = ` A-Z 0-9), or a name such as F1-F12, Home, End, PageUp, PageDown,
; Insert, Delete, Up, Down, Left, Right, Numpad0-Numpad9, Space, Tab, Enter. Word names also work for symbols:
; LeftBracket, RightBracket, Backslash, Semicolon, Apostrophe, Grave, Comma, Period, Slash, Minus, Equals.
; DirectInput scan codes (e.g. 26 or 0x1A) are accepted too. Keys are physical positions: on non-US keyboards
; the defaults are the three keys right of P (above Enter), whatever their labels.
; The game log (My Games/Skyrim Special Edition/SKSE/PiPPlayer.log) warns if a key is also a game control.
; Open or close the control panel (pauses the game while open)
TogglePanel=[
; Pause or resume
TogglePause=]
; Show or hide the player
ToggleVisible=\
